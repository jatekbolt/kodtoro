<html lang="en">
<head>

<style>
  :root {
    --desk: #E2E8EF; --paper: #F9FBFD; --table: #E9E9E6; --ink-x: #1E3F9C; --text: #22303F; --muted: #586676; --edge: #C9D4E0;
    /* the plastic board */
    --plastic: #855E4C; --plastic-hi: #9A715D; --plastic-lo: #6E4C3C; --recess: #6A4839; --hole: #22150F; --emboss: #A9826D;
    --cell: 40px;
    --hand: "Kalam", "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
    --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-contrast="high"] {
    --grid: #6F8BA8; --muted: #34414E; --edge: #7C8DA0; --text: #0E1620; --ink-x: #0033A0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #0F151D; --paper: #18212D; --table: #1A222D; --ink-x: #86A9FF; --text: #E2E8F0; --muted: #9AA8B8; --edge: #2A3647;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #0F151D; --paper: #18212D; --table: #1A222D; --ink-x: #86A9FF; --text: #E2E8F0; --muted: #9AA8B8; --edge: #2A3647;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-contrast="high"]:not([data-theme="light"]) { --grid: #6A84A3; --muted: #D2DBE5; --edge: #6A7C92; --text: #FFFFFF; --ink-x: #A8C2FF; }
  }
  :root[data-contrast="high"][data-theme="dark"] { --grid: #6A84A3; --muted: #D2DBE5; --edge: #6A7C92; --text: #FFFFFF; --ink-x: #A8C2FF; }
  :root[data-contrast="high"] *:focus-visible { outline-width: 3px !important; }
  :root[data-contrast="high"] .lang-btn[aria-pressed="true"] { border-width: 2.5px; }
  :root[data-contrast="high"] .row.current, :root[data-contrast="high"] .panel-frame.current { box-shadow: 0 0 0 4px #FFD400; }
  :root[data-contrast="high"] .cell.target, :root[data-contrast="high"] .keybox.editable { box-shadow: inset 2px 2px 3px rgba(0,0,0,.45), 0 0 0 4px #FFD400; }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--desk); color: var(--text); font-family: var(--sans); font-size: 1rem; line-height: 1.5; }

  .layout {
    max-width: 1180px; margin: 0 auto; padding: 20px;
    display: grid; gap: 20px;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "intro" "table" "controls";
  }
  @media (min-width: 900px) {
    .layout {
      grid-template-columns: minmax(270px, 320px) minmax(0, 1fr);
      grid-template-areas: "intro table" "controls table";
      grid-template-rows: auto 1fr;
      align-items: start; padding: 32px; gap: 24px 36px;
    }
  }
  .intro { grid-area: intro; }
  .pills { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; margin: 0 0 .9rem; }
  .lang { display: flex; gap: .35rem; margin: 0; }
  .home { display: inline-block; margin: 0 0 .7rem; font-size: .9rem; color: var(--ink-x); text-underline-offset: 3px; }
  .home:focus-visible { outline: 2px solid var(--ink-x); outline-offset: 2px; border-radius: 4px; }
  .lang-btn {
    font: .85rem var(--sans); padding: .25rem .7rem; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--edge); background: var(--paper); color: var(--muted);
  }
  .lang-btn[aria-pressed="true"] { border-color: var(--ink-x); color: var(--ink-x); font-weight: 700; }
  h1 {
    font-family: var(--hand); font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 3.6rem); line-height: 1;
    color: var(--ink-x); margin: 0 0 .35rem;
    transform: rotate(-2deg); transform-origin: left center;
  }
  .rules { margin: 0 0 1.1rem; color: var(--muted); max-width: 38ch; }
  .status { font-family: var(--hand); font-size: 1.4rem; line-height: 1.3; min-height: 2.6em; margin: 0 0 .6rem; }
  .score { display: flex; align-items: flex-end; gap: .9rem; font-family: var(--hand); }
  .score .side { display: grid; justify-items: center; line-height: 1.1; min-width: 4.5rem; }
  .score .num { font-size: 2.4rem; font-weight: 700; }
  .score small { font-family: var(--sans); font-size: .85rem; color: var(--muted); max-width: 9rem; text-align: center; overflow-wrap: anywhere; }
  .score .colon { font-size: 2.2rem; padding-bottom: 1.35rem; color: var(--muted); }
  .score-note { font-size: .9rem; color: var(--muted); margin: .25rem 0 0; max-width: 38ch; }
  .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; margin-right: .35rem; background: var(--muted); vertical-align: middle; }
  .dot.on { background: #2E9E5B; }

  /* ---------- the table the board lies on ---------- */
  .table {
    grid-area: table; background: var(--table); border-radius: 16px; padding: 26px 22px;
    display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; justify-content: center; min-width: 0;
  }

  /* ---------- the plastic board ---------- */
  .board {
    background: linear-gradient(165deg, var(--plastic-hi), var(--plastic) 45%, var(--plastic-lo));
    border-radius: 14px; padding: 14px 14px 18px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.16), inset 0 -3px 0 rgba(0,0,0,.25), 0 14px 26px rgba(40,24,14,.38), 0 2px 4px rgba(40,24,14,.3);
    display: grid; gap: 14px; width: max-content;
  }
  .top { display: flex; align-items: center; gap: 10px; }
  .panel-frame {
    display: flex; gap: 6px; padding: 6px; border-radius: 6px;
    background: var(--plastic);
    box-shadow: 0 0 0 3px var(--plastic-hi), 0 0 0 4px rgba(0,0,0,.18), inset 0 1px 2px rgba(0,0,0,.25);
    position: relative;
  }
  .panel-frame.current { box-shadow: 0 0 0 3px #E9C46A, 0 0 0 4px rgba(0,0,0,.18), inset 0 1px 2px rgba(0,0,0,.25); }
  .shield {
    position: absolute; inset: -2px; border-radius: 6px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, var(--plastic-hi), var(--plastic-lo));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.2), inset 0 -2px 0 rgba(0,0,0,.25), 0 3px 6px rgba(0,0,0,.3);
  }
  .logo {
    width: var(--cell); height: var(--cell); border-radius: 50%; margin-left: 8px;
    box-shadow: inset 0 0 0 3px var(--emboss), inset 0 0 0 5px var(--plastic-lo), inset 0 0 0 9px var(--plastic);
    background: radial-gradient(circle, var(--plastic-lo) 0 3px, transparent 4px);
    opacity: .8;
  }
  .rows { display: flex; flex-direction: column-reverse; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; padding: 3px; margin: -3px; border-radius: 8px; }
  .row.current { box-shadow: 0 0 0 2px rgba(233,196,106,.85); }
  .cell, .keybox {
    width: var(--cell); height: var(--cell); border-radius: 4px; padding: 0; border: 0; margin: 0;
    background: var(--recess);
    box-shadow: inset 2px 2px 3px rgba(0,0,0,.45), inset -1px -1px 0 rgba(255,255,255,.12);
    display: grid; place-items: center; color: inherit;
  }
  .keybox { margin-left: 10px; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 4px; }
  button.cell, button.khole { cursor: pointer; }
  .cell.target { box-shadow: inset 2px 2px 3px rgba(0,0,0,.45), 0 0 0 2px #E9C46A; }
  .cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .khole { width: 100%; height: 100%; padding: 0; border: 0; background: transparent; display: grid; place-items: center; border-radius: 50%; }
  .khole svg, .kspot svg { width: 13px; height: 13px; display: block; overflow: visible; }
  .kspot { display: grid; place-items: center; }
  .keybox.editable { box-shadow: inset 2px 2px 3px rgba(0,0,0,.45), 0 0 0 2px #E9C46A; }
  .cell:focus-visible, .khole:focus-visible, .comp:focus-visible { outline: 2px solid #E9C46A; outline-offset: 2px; }
  .drop svg { animation: drop .18s ease-out; }
  @keyframes drop { from { transform: translateY(-6px) scale(.85); opacity: .3; } to { transform: none; opacity: 1; } }
  .reveal svg { animation: drop .3s ease-out both; }
  .reveal:nth-child(2) svg { animation-delay: .1s; }
  .reveal:nth-child(3) svg { animation-delay: .2s; }
  .reveal:nth-child(4) svg { animation-delay: .3s; }

  /* ---------- the sorting tray ---------- */
  .side-col { display: grid; gap: 14px; width: 100%; max-width: 236px; }
  .tray {
    background: linear-gradient(165deg, var(--plastic-hi), var(--plastic) 50%, var(--plastic-lo));
    border-radius: 12px; padding: 10px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.16), inset 0 -3px 0 rgba(0,0,0,.25), 0 10px 20px rgba(40,24,14,.32);
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .comp {
    position: relative; height: 66px; padding: 0; border: 0; border-radius: 5px; cursor: pointer;
    background: var(--recess);
    box-shadow: inset 2px 2px 4px rgba(0,0,0,.5), inset -1px -1px 0 rgba(255,255,255,.12);
    display: grid; place-items: center;
  }
  .comp svg { width: 78px; height: 58px; display: block; }
  .comp:disabled { cursor: default; }
  .comp:disabled svg { opacity: .25; }
  .comp .k { position: absolute; top: 3px; left: 6px; font: 700 .72rem var(--sans); color: #F1E3C8; opacity: .8; }
  .comp .lbl { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font: .72rem var(--sans); color: #F1E3C8; }
  .comp.keyc svg { height: 42px; margin-top: -10px; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  .tray-note { font-size: .9rem; margin: 0; min-height: 1.2em; color: var(--text); }
  .legend { font-size: .9rem; color: var(--muted); margin: 0; display: grid; gap: .25rem; }
  .legend span { display: inline-flex; align-items: center; gap: .45rem; }
  .legend svg { width: 14px; height: 14px; }

  @media (max-width: 520px) {
    :root { --cell: 34px; }
    .layout { padding: 14px; gap: 16px; }
    .table { padding: 18px 10px; gap: 20px; }
    .side-col { max-width: none; }
    .tray { grid-template-columns: repeat(4, 1fr); }
    .tray.keys-mode { grid-template-columns: 1fr 1fr; }
    .comp { height: 58px; }
    .comp svg { width: 64px; height: 50px; }
  }

  /* ---------- settings ---------- */
  .controls { grid-area: controls; display: grid; gap: 1rem; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  fieldset[disabled] { opacity: .45; }
  legend, .label { display: block; font-weight: 700; padding: 0; margin-bottom: .35rem; font-size: .95rem; }
  .options { display: flex; flex-wrap: wrap; gap: .4rem; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .opt span {
    display: inline-block; padding: .4rem .75rem;
    border: 1.5px solid var(--edge); border-radius: 8px;
    background: var(--paper); font-size: .95rem; cursor: pointer;
  }
  .opt input:checked + span { border-color: var(--ink-x); color: var(--ink-x); font-weight: 700; box-shadow: inset 0 -3px 0 var(--ink-x); }
  .opt input:focus-visible + span { outline: 2px solid var(--ink-x); outline-offset: 2px; }
  .buttons { display: flex; flex-wrap: wrap; gap: .5rem; }
  .btn {
    font: 700 1rem var(--sans); padding: .6rem 1rem; border-radius: 8px;
    border: 2px solid var(--text); background: transparent; color: var(--text); cursor: pointer;
  }
  .btn.primary { background: var(--ink-x); border-color: var(--ink-x); color: var(--paper); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible, .field:focus-visible, .lang-btn:focus-visible { outline: 2px solid var(--ink-x); outline-offset: 2px; }
  .note { font-size: .85rem; color: var(--muted); margin: 0; }
  .panel { display: grid; gap: .9rem; padding: 1rem; border: 1.5px dashed var(--edge); border-radius: 10px; }
  .stack { display: grid; gap: .9rem; }
  .row-f { display: flex; gap: .5rem; }
  .row-f .field { flex: 1; min-width: 0; }
  .field {
    font: 1rem var(--sans); color: var(--text); width: 100%;
    background: var(--paper); border: 1.5px solid var(--edge); border-radius: 8px; padding: .55rem .7rem;
  }
  .panel-msg { font-size: .9rem; margin: 0; min-height: 1.2em; }

  @media (prefers-reduced-motion: reduce) {
    .drop svg, .reveal svg { animation: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
  try {
    var th = localStorage.getItem("amoba-theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
    if (localStorage.getItem("amoba-contrast") === "high") document.documentElement.setAttribute("data-contrast", "high");
  } catch (e) {}
</script>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="pegDefs"></defs></svg>
<main class="layout">
  <header class="intro">
    <a class="home" href="/" data-i18n="allGames"></a>
    <div class="pills">
      <div class="lang" role="group" aria-label="Language / Nyelv">
        <button type="button" class="lang-btn" data-lang="hu" lang="hu">Magyar</button>

      </div>
      <div class="lang" role="group" data-i18n-aria="themeAria">

</main>

<script>
  // Sound effects, synthesized live (no recordings). Shared by all the games; switched with the "Hang / Sound" button.
  window.SFX = (function () {
    let ctx = null, master = null, noiseBuf = null;
    const enabled = () => { try { return localStorage.getItem("amoba-sound") !== "off"; } catch (e) { return true; } };
    function audio() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC(); master = ctx.createGain(); master.gain.value = .45; master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    // browsers only allow sound after a tap, so unlock on the first one
    window.addEventListener("pointerdown", () => { if (enabled()) audio(); }, { once: true });
    const rnd = (a, b) => a + Math.random() * (b - a);
    function tone(t, { type = "sine", f = 440, f2 = null, dur = .2, peak = .3, attack = .004 }) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
    }
    function noise(t, { dur = .1, peak = .3, attack = .003, type = "bandpass", f = 2000, f2 = null, q = 1, flat = false }) {
      const s = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf; s.loop = true;
      flt.type = type; flt.frequency.setValueAtTime(f, t); flt.Q.value = q;
      if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + dur);

  function setNote(el, key, ...args) { el._note = { key, args }; el.textContent = key ? t(key, ...args) : ""; }
  const noteKey = el => (el._note ? el._note.key : "");
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
  const cleanName = v => (typeof v === "string" ? v.replace(/\s+/g, " ").trim().slice(0, 24) : "");
  const myName = () => cleanName($("#myName").value);
  const baseUrl = () => location.href.split("#")[0];
  function randInt(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function randomCode(n) { return Array.from({ length: n }, () => CODE_CHARS[randInt(CODE_CHARS.length)]).join(""); }
  function myToken() { let tk = lsGet(K.token); if (!tk) { tk = randomCode(16); lsSet(K.token, tk); } return tk; }
  function setHash(name) {
    try {
      if (name) history.replaceState(null, "", "#" + name);
      else if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    } catch (e) {}
  }
  function load() {
    try {
      const s = JSON.parse(lsGet(K.settings) || "null");
      if (s) {
        if (["ai", "solve", "pvp", "online"].includes(s.mode)) S.mode = s.mode;
        if (s.colors === 6 || s.colors === 8) S.colors = s.colors;
        if (typeof s.repeats === "boolean") S.repeats = s.repeats;
        if (s.stats) {
          const a = s.stats.ai || {}, b = s.stats.solve || {}, c = s.stats.pvp || {};
          S.stats = { ai: { solved: +a.solved || 0, played: +a.played || 0, best: +a.best || 0 },
                      solve: { games: +b.games || 0, total: +b.total || 0 }, pvp: { 1: +c[1] || 0, 2: +c[2] || 0 } };
        }
      }
    } catch (e) {}
    $("#myName").value = cleanName(lsGet(K.name) || "");
  }
  const save = () => lsSet(K.settings, JSON.stringify({ mode: S.mode, colors: S.colors, repeats: S.repeats, stats: S.stats }));

  // ---------- rules ----------
  function scoreCode(secret, guess) {
    let b = 0;
    const sc = new Array(8).fill(0), gc = new Array(8).fill(0);
    for (let i = 0; i < LEN; i++) {
      if (secret[i] === guess[i]) b++;
      else { sc[secret[i]]++; gc[guess[i]]++; }
    }
    let w = 0;
    for (let c = 0; c < 8; c++) w += Math.min(sc[c], gc[c]);
    return [b, w];

  function validCode(code, colors, repeats) {
    if (!Array.isArray(code) || code.length !== LEN) return false;
    if (!code.every(c => Number.isInteger(c) && c >= 0 && c < colors)) return false;
    return repeats || new Set(code).size === LEN;
  }
  function randomSecret(colors, repeats) {
    if (repeats) return Array.from({ length: LEN }, () => randInt(colors));
    const pool = Array.from({ length: colors }, (_, i) => i);
    for (let i = pool.length - 1; i > 0; i--) { const j = randInt(i + 1); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    return pool.slice(0, LEN);
  }
  function allCodes(colors, repeats) {
    const out = [];
    for (let a = 0; a < colors; a++) for (let b = 0; b < colors; b++) for (let c = 0; c < colors; c++) for (let d = 0; d < colors; d++) {
      const code = [a, b, c, d];
      if (repeats || new Set(code).size === LEN) out.push(code);
    }
    return out;
  }
  const keyCounts = () => [keys.filter(k => k === "b").length, keys.filter(k => k === "w").length];

  // ---------- what the board shows ----------
  function amMaker() { const g = NET.g; return !!g && ((NET.role === "host") === g.makerIsHost); }
  function mySecret() {
    try {
      const s = JSON.parse(lsGet(K.secret) || "null");
      if (s && NET.g && s.game === NET.code && s.round === NET.g.round && validCode(s.secret, NET.g.colors, NET.g.repeats)) return s.secret;
    } catch (e) {}
    return null;
  }
  function saveSecret(code) { lsSet(K.secret, JSON.stringify({ game: NET.code, round: NET.g.round, secret: code })); }

  // secret: "edit" | "shown" | "covered" | "empty"
  function view() {
    const base = { colors: L.colors, repeats: L.repeats, guesses: L.guesses, phase: L.phase, pending: L.pending, secret: L.secret };
    switch (S.mode) {
      case "ai":
        return { ...base, secretMode: L.phase === "over" ? "shown" : "covered", canGuess: L.phase === "guessing", scoring: false };
      case "solve":
        return { ...base, secretMode: L.phase === "hiding" ? "edit" : "shown", canGuess: false, scoring: L.phase === "guessing" && !!L.pending };
      case "pvp":
        return { ...base,
          secretMode: L.phase === "hiding" ? "edit" : L.phase === "over" ? "shown" : (L.pending && L.peek ? "shown" : "covered"),
          canGuess: L.phase === "guessing" && !L.pending, scoring: L.phase === "guessing" && !!L.pending };
      case "online": {
        const g = NET.g;
        if (!g) return { colors: S.colors, repeats: S.repeats, guesses: [], pending: null, phase: "none", secret: null, secretMode: "empty", canGuess: false, scoring: false };
        const maker = amMaker(), sec = maker ? mySecret() : null;
        const ok = NET.connected && !NET.pending;
        let secretMode = "covered", secret = null;
        if (g.phase === "over" && (g.revealed || sec)) { secretMode = "shown"; secret = g.revealed || sec; }
        else if (maker && sec) { secretMode = "shown"; secret = sec; }
        else if (maker && g.phase === "hiding" && ok) secretMode = "edit";
        return {
          colors: g.colors, repeats: g.repeats, guesses: g.guesses, pending: g.pending, phase: g.phase, secret, secretMode,
          canGuess: !maker && g.phase === "guessing" && ok && !g.pending,
          scoring: maker && g.phase === "guessing" && !!g.pending && ok && !!sec
        };
      }
    }
  }

  // ---------- drawing ----------
  function mix(hex, to, amt) {
    const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
    const ch = s => Math.round(((a >> s) & 255) * (1 - amt) + ((b >> s) & 255) * amt);
    return "#" + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
  }
  function buildDefs() {
    let d = "";
    const grad = (id, col) => `<radialGradient id="${id}" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="${mix(col, "#ffffff", .38)}"/>` +
      `<stop offset=".5" stop-color="${col}"/><stop offset="1" stop-color="${mix(col, "#000000", .38)}"/></radialGradient>`;
    COLORS.forEach((c, i) => { d += grad("pg" + i, c); });
    d += grad("kb", KEY_BLACK.replace("#15191B", "#3A4146")) + grad("kw", KEY_WHITE);
    $("#pegDefs").innerHTML = d;
  }
  const isLight = hex => { const n = parseInt(hex.slice(1), 16); return .299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255) > 150; };
  function pegSVG(c) {
    const hc = HC();
    // in high-visibility mode every peg also carries its number, so colors never have to be told apart by hue alone
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="21.6" cy="23" rx="14.6" ry="14" fill="rgba(0,0,0,.38)"/>` +
      `<circle cx="20" cy="20" r="14.6" fill="url(#pg${c})" stroke="${hc ? "#000" : mix(COLORS[c], "#000000", .5)}" stroke-width="${hc ? 2 : .8}"/>` +
      `<ellipse cx="14.6" cy="13.4" rx="5.2" ry="3.2" fill="#ffffff" opacity="${hc ? .25 : .5}" transform="rotate(-32 14.6 13.4)"/>` +
      (hc ? `<text x="20" y="21.5" text-anchor="middle" dominant-baseline="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-weight="700" font-size="17" fill="${isLight(COLORS[c]) ? "#000" : "#fff"}">${c + 1}</text>` : "") +
      `</svg>`;
  }
  const holeSVG = () => `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="4.2" fill="var(--hole)"/><path d="M16.2 22.2a4.2 4.2 0 0 0 7.6 0" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/></svg>`;
  function keySVG(k) {
    if (!k) return `<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="2.1" fill="var(--hole)"/></svg>`;
    return `<svg viewBox="0 0 14 14" aria-hidden="true"><ellipse cx="7.7" cy="8" rx="5.4" ry="5.2" fill="rgba(0,0,0,.4)"/>` +
      `<circle cx="7" cy="7" r="5.4" fill="url(#${k === "b" ? "kb" : "kw"})" stroke="${HC() ? (k === "b" ? "#fff" : "#000") : k === "b" ? "#000" : "#9b8a66"}" stroke-width="${HC() ? 1.2 : .5}"/>` +
      `<ellipse cx="5.2" cy="4.9" rx="1.8" ry="1.1" fill="#fff" opacity=".55"/></svg>`;
  }
  const colorName = c => t("colorNames")[c];
  function keyList(b, w) { const a = []; for (let i = 0; i < LEN; i++) a.push(i < b ? "b" : i < b + w ? "w" : null); return a; }

  function draftCells() {
    let h = "";
    for (let i = 0; i < LEN; i++) {
      const c = draft[i];
      h += `<button type="button" class="cell${c == null && i === sel ? " target" : ""}${i === dropSlot ? " drop" : ""}" data-slot="${i}" aria-label="${esc(t("slotAria", i + 1, c == null ? t("empty") : colorName(c)))}">` +
        (c == null ? holeSVG() : pegSVG(c)) + `</button>`;
    }
    return h;
  }
  function staticCells(code, animate) {
    let h = "";
    for (let i = 0; i < LEN; i++) h += `<span class="cell${animate ? " drop" : ""}">${code ? pegSVG(code[i]) : holeSVG()}</span>`;
    return h;
  }
  function keyboxHTML(list, editable, animate) {
    if (editable) {
      let h = "";
      list.forEach((k, i) => {
        h += `<button type="button" class="khole" data-key="${i}" aria-label="${esc(t("kholeAria", i + 1, k === "b" ? t("kBlack") : k === "w" ? t("kWhite") : t("empty")))}">${keySVG(k)}</button>`;
      });
      return `<div class="keybox editable">${h}</div>`;
    }
    return `<div class="keybox" aria-hidden="true">${list.map(k => `<span class="kspot${animate && k ? " drop" : ""}">${keySVG(k)}</span>`).join("")}</div>`;
  }

  function renderBoard() {
    const v = view();
    // hidden-code panel
    let panel = "";
    const revealNow = v.secretMode === "shown" && v.phase === "over";
    const rk = revealNow ? `${S.mode}|${NET.g ? NET.g.round : L.round}|${v.guesses.length}` : "";
    const animateReveal = revealNow && rk !== revealKey;
    if (revealNow) revealKey = rk;
    if (v.secretMode === "edit") panel = draftCells();
    else if (v.secretMode === "shown" && v.secret) {
      for (let i = 0; i < LEN; i++) panel += `<span class="cell${animateReveal ? " reveal" : ""}" role="img" aria-label="${esc(t("slotAria", i + 1, colorName(v.secret[i])))}">${pegSVG(v.secret[i])}</span>`;
    } else {
      panel = staticCells(null, false);
      if (v.secretMode === "covered") panel += `<div class="shield" role="img" aria-label="${esc(t("secretAria") + ": " + t("hiddenPeg"))}"></div>`;
    }
    let h = `<div class="top"><div class="panel-frame${v.secretMode === "edit" ? " current" : ""}" role="group" aria-label="${esc(t("secretAria"))}">${panel}</div><div class="logo" aria-hidden="true"></div></div>`;

    // guess rows, filled from the bottom up like the real board
    const key = `${S.mode}|${NET.g ? NET.g.round : L.round}`;
    if (key !== shownKey) { shownKey = key; shownGuesses = v.guesses.length; }
    let rows = "";
    for (let r = 0; r < ROWS; r++) {
      const gu = v.guesses[r];
      if (gu) {
        const code = gu.slice(0, LEN), b = gu[4], w = gu[5], animate = r >= shownGuesses;
        rows += `<div class="row" role="group" aria-label="${esc(t("rowAria", r + 1, code.map(colorName).join(", "), b, w))}">${staticCells(code, false)}${keyboxHTML(keyList(b, w), false, animate)}</div>`;
      } else if (r === v.guesses.length && v.pending) {
        rows += `<div class="row current" role="group" aria-label="${esc(t("pendingAria", r + 1, v.pending.map(colorName).join(", ")))}">${staticCells(v.pending, false)}${keyboxHTML(v.scoring ? keys : keyList(0, 0), v.scoring, false)}</div>`;
      } else if (r === v.guesses.length && v.canGuess) {
        rows += `<div class="row current">${draftCells()}${keyboxHTML(keyList(0, 0), false, false)}</div>`;
      } else {
        rows += `<div class="row" aria-hidden="true">${staticCells(null, false)}${keyboxHTML(keyList(0, 0), false, false)}</div>`;
      }
    }
    shownGuesses = v.guesses.length;
    boardEl.innerHTML = h + `<div class="rows">${rows}</div>`;
    dropSlot = -1;

    // the sorting tray

    $("#trayWrap").hidden = !(codeMode || v.scoring);
    const tray = $("#tray");
    tray.classList.toggle("keys-mode", v.scoring);
    if (v.scoring) {
      tray.innerHTML =
        `<button type="button" class="comp keyc" data-keyc="b" aria-label="${esc(t("keyBlackAria"))}"><span class="k">1</span>${trayPegs(null, "b")}<span class="lbl">${esc(t("keyBlackLbl"))}</span></button>` +
        `<button type="button" class="comp keyc" data-keyc="w" aria-label="${esc(t("keyWhiteAria"))}"><span class="k">2</span>${trayPegs(null, "w")}<span class="lbl">${esc(t("keyWhiteLbl"))}</span></button>`;
      $("#submitBtn").textContent = t("confirmKeys");
      $("#submitBtn").disabled = false;
      $("#clearBtn").disabled = keys.every(k => !k);
    } else if (codeMode) {
      let p = "";
      for (let c = 0; c < v.colors; c++) {
        const used = !v.repeats && draft.includes(c);
        p += `<button type="button" class="comp" data-color="${c}" ${used ? "disabled" : ""} aria-label="${esc(t("swatchAria", colorName(c), c + 1))}"><span class="k">${c + 1}</span>${trayPegs(c)}</button>`;
      }
      tray.innerHTML = p;
      $("#submitBtn").textContent = v.secretMode === "edit" ? t("hide") : t("check");
      $("#submitBtn").disabled = !draft.every(x => x != null);
      $("#clearBtn").disabled = draft.every(x => x == null);
    }
    const peek = S.mode === "pvp" && v.scoring;
    $("#peekBtn").hidden = !peek;
    if (peek) $("#peekBtn").textContent = L.peek ? t("peekHide") : t("peekShow");
    if (!v.scoring && noteKey(trayNote) === "wrongKeys") setNote(trayNote, "");
    $("#againBtn").hidden = !(v.phase === "over" && (S.mode !== "online" || (NET.connected && NET.g)));
  }
  // a little heap of pegs in a tray compartment
  function trayPegs(c, k) {
    if (k) {
      const spots = [[22, 18], [38, 14], [52, 20], [30, 30], [46, 31]];
      return `<svg viewBox="0 0 76 44" aria-hidden="true">${spots.map(([x, y]) => `<g transform="translate(${x - 9} ${y - 9}) scale(1.3)">${keySVG(k).replace(/<\/?svg[^>]*>/g, "")}</g>`).join("")}</svg>`;
    }
    const spots = [[22, 22], [44, 18], [58, 34], [34, 38]];
    return `<svg viewBox="0 0 78 58" aria-hidden="true">${spots.map(([x, y]) => `<g transform="translate(${x - 14} ${y - 14}) scale(.7)">${pegSVG(c).replace(/<\/?svg[^>]*>/g, "")}</g>`).join("")}</svg>`;
  }

  // ---------- editing ----------
  function codeEditable() { const v = view(); return v.secretMode === "edit" || v.canGuess; }
  function nextEmpty(from) {
    for (let k = 0; k < LEN; k++) { const i = (from + k) % LEN; if (draft[i] == null) return i; }
    return from;
  }
  function addColor(c) {
    const v = view();
    if (!(v.secretMode === "edit" || v.canGuess) || c >= v.colors) return;
    if (!v.repeats && draft.includes(c) && draft[sel] !== c) return;
    draft[sel] = c; dropSlot = sel; SFX.play("peg");
    sel = nextEmpty((sel + 1) % LEN);
    render();
  }
  function addKey(k) {
    if (!view().scoring) return;
    const i = keys.indexOf(null);
    if (i < 0) return;
    keys[i] = k; SFX.play("keyPeg"); setNote(trayNote, ""); render();
  }
  function removeLast() {
    const v = view();
    if (v.scoring) {
      for (let i = LEN - 1; i >= 0; i--) if (keys[i]) { keys[i] = null; render(); return; }
      return;
    }
    if (!codeEditable()) return;
    for (let i = LEN - 1; i >= 0; i--) if (draft[i] != null) { draft[i] = null; sel = i; render(); return; }
  }
  function clearDraft() { draft = [null, null, null, null]; sel = 0; }
  function clearKeys() { keys = [null, null, null, null]; }

  function submit() {
    const v = view();
    if (v.scoring) { confirmKeys(); return; }
    if (!draft.every(x => x != null)) return;
    const code = draft.slice();
    if (!validCode(code, v.colors, v.repeats)) return;
    if (v.secretMode === "edit") {
      clearDraft();
      if (S.mode === "solve") { L.secret = code; L.phase = "guessing"; render(); startSolver(); return; }
      if (S.mode === "pvp") { L.secret = code; L.phase = "guessing"; render(); return; }
      if (S.mode === "online") { onlineHide(code); return; }
    } else if (v.canGuess) {
      clearDraft();
      if (S.mode === "ai") { const [b, w] = scoreCode(L.secret, code); applyLocal(code, b, w); return; }
      if (S.mode === "pvp") { L.pending = code; L.peek = false; clearKeys(); render(); return; }
      if (S.mode === "online") { onlineGuess(code); return; }
    }
  }
  // The codemaker places the key pegs; the game only checks them against the code.
  function confirmKeys() {
    const v = view();
    if (!v.scoring) return;
    const [b, w] = keyCounts();
    const secret = S.mode === "online" ? mySecret() : L.secret;
    const [eb, ew] = scoreCode(secret, v.pending);
    if (b !== eb || w !== ew) { setNote(trayNote, "wrongKeys"); return; }
    setNote(trayNote, "");
    clearKeys();
    if (S.mode === "online") { onlineKeys(b, w); return; }
    const code = L.pending;
    L.pending = null; L.peek = false;
    applyLocal(code, b, w);
  }

  // ---------- local modes ----------
  function newLocal(keepRound) {
    clearTimeout(aiTimer); aiTimer = null;
    clearDraft(); clearKeys(); setNote(trayNote, "");
    const round = keepRound ? L.round : L.round + 1;
    L = { secret: null, guesses: [], pending: null, phase: "hiding", round, maker: round % 2 ? 1 : 2, colors: S.colors, repeats: S.repeats, peek: false };
    if (S.mode === "ai") { L.secret = randomSecret(S.colors, S.repeats); L.phase = "guessing"; }
    render();
  }
  function applyLocal(code, b, w) {
    L.guesses.push([...code, b, w]);
    const n = L.guesses.length;
    if (S.mode === "solve") cands = cands.filter(c => { const [b2, w2] = scoreCode(c, code); return b2 === b && w2 === w; });
    if (b === LEN || n >= ROWS || (S.mode === "solve" && !cands.length)) {
      L.phase = "over";
      if (S.mode === "ai") {
        S.stats.ai.played++;
        if (b === LEN) { S.stats.ai.solved++; if (!S.stats.ai.best || n < S.stats.ai.best) S.stats.ai.best = n; }
      } else if (S.mode === "pvp") S.stats.pvp[L.maker] += n + (b === LEN ? 0 : 1);
      else if (S.mode === "solve") { S.stats.solve.games++; S.stats.solve.total += b === LEN ? n : ROWS + 1; }
      save();
    } else if (S.mode === "solve") stepSolver();
    render();
  }
  function startSolver() { cands = allCodes(L.colors, L.repeats); stepSolver(); }
  function stepSolver() {
    aiTimer = setTimeout(() => {
      aiTimer = null;
      if (S.mode !== "solve" || L.phase !== "guessing") return;
      L.pending = L.guesses.length ? cands[randInt(cands.length)] : (L.repeats ? [0, 0, 1, 1] : [0, 1, 2, 3]);
      clearKeys(); render();
    }, 800);
    renderUI();
  }

  // ---------- online play ----------
  const peerLib = () => typeof window.Peer === "function";
  function scheduleRetry(fn, ms) { clearTimeout(NET.retry); NET.retry = setTimeout(fn, ms); }
  function destroyPeer(delay) { const p = NET.peer; NET.peer = null; if (p) setTimeout(() => { try { p.destroy(); } catch (e) {} }, delay || 0); }
  function netError(err, retryFn) {
    if (err && err.type === "browser-incompatible") { setNote(onNote, "badBrowser"); return; }
    setNote(onNote, "noService"); scheduleRetry(retryFn, 5000);
  }
  const inviteLink = () => `${baseUrl()}#join-${NET.code}`;
  function saveHost() { if (NET.role === "host") lsSet(K.host, JSON.stringify({ code: NET.code, g: NET.g, token: NET.boundToken, oppName: NET.oppName })); }
  function validG(g) {
    if (!g || typeof g !== "object") return null;
    const colors = g.colors === 8 ? 8 : 6, repeats = g.repeats !== false;
    const guesses = Array.isArray(g.guesses) ? g.guesses.filter(x => Array.isArray(x) && x.length === 6 &&
      validCode(x.slice(0, 4), colors, true) && Number.isInteger(x[4]) && Number.isInteger(x[5]) && x[4] >= 0 && x[5] >= 0 && x[4] + x[5] <= 4).slice(0, ROWS) : [];
    const sc = g.score && typeof g.score === "object" ? g.score : {};
    return {
      colors, repeats, round: Number.isInteger(g.round) ? g.round : 1, makerIsHost: g.makerIsHost !== false,
      phase: ["hiding", "guessing", "over"].includes(g.phase) ? g.phase : "hiding", guesses,
      revealed: validCode(g.revealed, colors, true) ? g.revealed : null,
      score: { host: +sc.host || 0, guest: +sc.guest || 0 },
      pending: validCode(g.pending, colors, true) ? g.pending : null
    };
  }
  function resetNet() {
    clearTimeout(NET.retry);
    Object.assign(NET, { role: null, code: null, conn: null, pendingConn: null, connected: false, ready: false, lastSeen: 0,
                         boundToken: null, everJoined: false, full: false, pending: false, g: null, oppName: "" });
  }
  function leaveOnline(forget) {
    let delay = 0;
    if (forget && NET.conn && NET.connected) { try { NET.conn.send({ t: "bye" }); delay = 500; } catch (e) {} }
    destroyPeer(delay); resetNet(); clearDraft(); clearKeys();
    if (forget) { lsDel(K.host); lsDel(K.join); lsDel(K.secret); setHash(""); }
    if (S.mode === "online") render();
  }

  // The host keeps the official record; each player's secret code stays on their own device.
  function hostStart(saved) {
    if (!peerLib()) { setNote(onNote, "noLib"); return; }
    if (!IS_WEB) { setNote(onNote, "notWeb"); return; }
    leaveOnline(false);
    NET.role = "host";
    if (saved) {
      NET.code = saved.code; NET.g = validG(saved.g); NET.boundToken = saved.token || null;
      NET.oppName = cleanName(saved.oppName); NET.everJoined = !!saved.token;
    } else {
      NET.code = randomCode(6);
      NET.g = { colors: S.colors, repeats: S.repeats, round: 1, makerIsHost: true, phase: "hiding", guesses: [], revealed: null, score: { host: 0, guest: 0 }, pending: null };
      lsDel(K.secret);
    }
    lsDel(K.join);
    saveHost(); render(); openHostPeer();
  }
  function openHostPeer() {
    if (NET.role !== "host") return;
    destroyPeer(); setNote(onNote, "connecting");
    const peer = new Peer(PEER_PREFIX + NET.code, { debug: 0 });
    NET.peer = peer;
    peer.on("open", () => { if (NET.peer !== peer) return; NET.ready = true; setNote(onNote, ""); renderUI(); });
    peer.on("connection", conn => { if (NET.peer === peer) hostAccept(conn); });
    peer.on("disconnected", () => {
      if (NET.peer !== peer || peer.destroyed) return;
      NET.ready = false; renderUI();
      scheduleRetry(() => { if (!peer.destroyed) { try { peer.reconnect(); } catch (e) { openHostPeer(); } } }, 3000);
    });
    peer.on("error", err => {
      if (NET.peer !== peer) return;
      NET.ready = false;
      if (err.type === "unavailable-id") { setNote(onNote, "reopening"); scheduleRetry(openHostPeer, 5000); }
      else if (err.type !== "peer-unavailable") netError(err, openHostPeer);
      renderUI();
    });
  }
  function hostAccept(conn) {
    conn.on("data", msg => {
      if (!msg || typeof msg !== "object") return;
      const g = NET.g;
      if (msg.t === "hello") {
        const tok = typeof msg.token === "string" ? msg.token.slice(0, 40) : "";
        if (NET.boundToken && tok !== NET.boundToken && NET.conn && NET.connected) {
          try { conn.send({ t: "full" }); } catch (e) {}
          setTimeout(() => { try { conn.close(); } catch (e) {} }, 800);
          return;
        }
        if (NET.conn && NET.conn !== conn) { const old = NET.conn; NET.conn = null; try { old.close(); } catch (e) {} }
        NET.conn = conn; NET.connected = true; NET.lastSeen = Date.now();
        NET.boundToken = tok; NET.everJoined = true; NET.oppName = cleanName(msg.name);
        saveHost(); sendState(); setNote(onNote, ""); render();
        return;
      }
      if (conn !== NET.conn) return;
      NET.lastSeen = Date.now();
      switch (msg.t) {
        case "hidden":
          if (g.phase === "hiding" && !g.makerIsHost) { g.phase = "guessing"; saveHost(); render(); }
          sendState(); break;
        case "guess":   // the guest guessed; the host, as codemaker, places the key pegs
          if (g.phase === "guessing" && g.makerIsHost && !g.pending && msg.n === g.guesses.length && validCode(msg.code, g.colors, g.repeats)) {
            g.pending = msg.code; clearKeys(); saveHost(); render();
          }
          sendState(); break;
        case "keys": {  // the guest, as codemaker, placed the key pegs on the host's guess
          const b = msg.b, w = msg.w;
          if (!g.pending || g.makerIsHost || msg.n !== g.guesses.length) { sendState(); break; }
          if (!Number.isInteger(b) || !Number.isInteger(w) || b < 0 || w < 0 || b + w > LEN) { sendState(); break; }
          const code = g.pending; g.pending = null;
          addGuess(code, b, w, validCode(msg.secret, g.colors, g.repeats) ? msg.secret : null);
          break;
        }
        case "nosecret":
          if (!g.makerIsHost) { resetRound(); setNote(onNote, "noSecret"); }
          break;
        case "again": hostAgain(); break;
        case "name": NET.oppName = cleanName(msg.name); saveHost(); renderUI(); break;
      }
    });
    conn.on("open", () => { if (conn === NET.conn) sendState(); });
    const lost = () => { if (conn === NET.conn) { NET.conn = null; NET.connected = false; render(); } };
    conn.on("close", lost); conn.on("error", lost);
  }
  function sendState() {
    if (!NET.conn || !NET.connected || !NET.g) return;
    const g = NET.g;
    try {
      NET.conn.send({ t: "state", colors: g.colors, repeats: g.repeats, round: g.round, makerIsHost: g.makerIsHost, phase: g.phase,
                      guesses: g.guesses, revealed: g.revealed, score: g.score, pending: g.pending, name: myName() });
    } catch (e) {}
  }
  function addGuess(code, b, w, secret) {
    const g = NET.g;
    g.guesses.push([...code, b, w]);
    if (b === LEN || g.guesses.length >= ROWS) {
      g.phase = "over"; g.revealed = secret || null;
      const pts = g.guesses.length + (b === LEN ? 0 : 1);
      if (g.makerIsHost) g.score.host += pts; else g.score.guest += pts;
    }
    saveHost(); sendState(); render();
  }
  function resetRound() {
    const g = NET.g;
    g.phase = "hiding"; g.guesses = []; g.pending = null; g.revealed = null;
    if (g.makerIsHost) lsDel(K.secret);
    clearDraft(); clearKeys(); saveHost(); sendState(); render();
  }
  function hostAgain() {
    const g = NET.g;
    if (!g || g.phase !== "over") return;
    g.round++; g.makerIsHost = !g.makerIsHost; g.phase = "hiding"; g.guesses = []; g.revealed = null; g.pending = null;
    clearDraft(); clearKeys(); saveHost(); sendState(); render();
  }

  function guestStart(code) {
    if (!peerLib()) { setNote(onNote, "noLib"); return; }
    leaveOnline(false);
    NET.role = "guest"; NET.code = code;
    lsSet(K.join, code); setHash("join-" + code);
    render(); openGuestPeer();
  }
  function openGuestPeer() {
    if (NET.role !== "guest") return;
    destroyPeer(); setNote(onNote, "connecting");
    const peer = new Peer({ debug: 0 });
    NET.peer = peer;
    peer.on("open", () => { if (NET.peer !== peer) return; NET.ready = true; connectToHost(); });
    peer.on("disconnected", () => {
      if (NET.peer !== peer || peer.destroyed) return;
      NET.ready = false;
      scheduleRetry(() => { if (!peer.destroyed) { try { peer.reconnect(); } catch (e) { openGuestPeer(); } } }, 3000);
    });
    peer.on("error", err => {
      if (NET.peer !== peer) return;
      if (err.type === "peer-unavailable") { if (!NET.connected) { setNote(onNote, "waitHost"); scheduleRetry(connectToHost, 4000); } }
      else netError(err, openGuestPeer);
      renderUI();
    });
  }
  function connectToHost() {
    const peer = NET.peer;
    if (NET.role !== "guest" || NET.full || NET.connected) return;
    if (!peer || peer.destroyed) { openGuestPeer(); return; }
    if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} scheduleRetry(connectToHost, 3000); return; }
    if (NET.pendingConn) { try { NET.pendingConn.close(); } catch (e) {} }
    const conn = peer.connect(PEER_PREFIX + NET.code, { reliable: true });
    NET.pendingConn = conn;
    const giveUp = setTimeout(() => {
      if (NET.pendingConn === conn && !NET.connected) { NET.pendingConn = null; try { conn.close(); } catch (e) {} scheduleRetry(connectToHost, 2000); }
    }, 12000);
    conn.on("open", () => {
      clearTimeout(giveUp);
      if (NET.pendingConn !== conn) { try { conn.close(); } catch (e) {} return; }
      NET.pendingConn = null; NET.conn = conn; NET.connected = true; NET.lastSeen = Date.now();
      setNote(onNote, "");
      try { conn.send({ t: "hello", token: myToken(), name: myName() }); } catch (e) {}
      renderUI();
    });
    conn.on("data", msg => { if (conn !== NET.conn || !msg || typeof msg !== "object") return; NET.lastSeen = Date.now(); guestData(msg); });
    const lost = () => { clearTimeout(giveUp); if (conn === NET.conn) guestLost(); };
    conn.on("close", lost); conn.on("error", lost);
  }
  function guestLost() {
    NET.conn = null; NET.connected = false; NET.pending = false;
    render();
    if (NET.role === "guest" && !NET.full) { setNote(onNote, "lost"); scheduleRetry(connectToHost, 2000); }
  }
  function guestData(msg) {
    if (msg.t === "state") {
      const before = NET.g;
      NET.g = validG(msg);
      NET.oppName = cleanName(msg.name);
      NET.pending = false;
      const g = NET.g;
      if (!before || before.round !== g.round || before.phase !== g.phase) clearDraft();
      if (!before || String(before.pending) !== String(g.pending)) clearKeys();
      if (["connecting", "waitHost", "lost"].includes(noteKey(onNote))) setNote(onNote, "");
      if (amMaker() && g.phase !== "hiding" && g.phase !== "over" && !mySecret()) { try { NET.conn.send({ t: "nosecret" }); } catch (e) {} }
      render();
    } else if (msg.t === "full") { NET.full = true; setNote(onNote, "fullNote"); renderUI(); }
    else if (msg.t === "bye") { leaveOnline(true); setNote(onNote, "bye"); renderUI(); }
  }

  function onlineHide(code) {
    const g = NET.g;
    saveSecret(code);
    if (NET.role === "host") { g.phase = "guessing"; saveHost(); sendState(); render(); }
    else { NET.pending = true; try { NET.conn.send({ t: "hidden" }); } catch (e) { NET.pending = false; } render(); }
  }
  function onlineGuess(code) {
    const g = NET.g;
    if (NET.role === "host") { g.pending = code; saveHost(); sendState(); render(); return; }
    NET.pending = true;
    try { NET.conn.send({ t: "guess", n: g.guesses.length, code }); } catch (e) { NET.pending = false; }
    render();
    setTimeout(() => { if (NET.pending) { NET.pending = false; render(); } }, 8000);
  }
  function onlineKeys(b, w) {
    const g = NET.g, code = g.pending;
    const finished = b === LEN || g.guesses.length + 1 >= ROWS;
    if (NET.role === "host") { g.pending = null; addGuess(code, b, w, finished ? mySecret() : null); return; }
    NET.pending = true;
    try { NET.conn.send({ t: "keys", n: g.guesses.length, b, w, secret: finished ? mySecret() : null }); } catch (e) { NET.pending = false; }
    render();
    setTimeout(() => { if (NET.pending) { NET.pending = false; render(); } }, 8000);
  }
  function nextRound() {
    if (S.mode !== "online") { newLocal(false); return; }
    if (NET.role === "host") hostAgain();
    else if (NET.conn) { try { NET.conn.send({ t: "again" }); } catch (e) {} }
  }

  setInterval(() => {
    if (!NET.conn || !NET.connected) return;
    try { NET.conn.send({ t: "ping" }); } catch (e) {}
    if (Date.now() - NET.lastSeen > 15000) {
      const c = NET.conn;
      if (NET.role === "host") { NET.conn = null; NET.connected = false; render(); } else guestLost();
      try { c.close(); } catch (e) {}
    }
  }, 4000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (NET.role === "guest" && !NET.connected && !NET.full) { clearTimeout(NET.retry); connectToHost(); }
    if (NET.role === "host") {
      if (!NET.peer || NET.peer.destroyed) openHostPeer();
      else if (NET.peer.disconnected) { try { NET.peer.reconnect(); } catch (e) {} }
    }
  });
  async function shareOrCopy(text, url, input) {
    if (navigator.share) {
      try { await navigator.share({ title: t("title"), text, url }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(`${text} ${url}`); setNote(onNote, "copied"); }
    catch (e) { input.focus(); input.select(); setNote(onNote, "copyBlocked"); }
  }

  // ---------- modes ----------
  function enterOnline() {
    clearDraft(); clearKeys(); render();
    let saved = null;
    try { saved = JSON.parse(lsGet(K.host) || "null"); } catch (e) {}
    const joined = lsGet(K.join);
    if (saved && typeof saved.code === "string" && /^[a-z2-9]{6}$/.test(saved.code)) hostStart(saved);
    else if (joined && /^[a-z2-9]{6}$/.test(joined)) guestStart(joined);
  }
  function setMode(m) {
    if (S.mode === m) return;
    clearTimeout(aiTimer); aiTimer = null;
    if (S.mode === "online") leaveOnline(false);
    S.mode = m; save(); setNote(onNote, ""); setNote(trayNote, "");
    if (m === "online") enterOnline(); else newLocal(true);
  }

  // ---------- UI ----------
  function oppLabel(capital) { return NET.oppName || t(capital ? "oppCap" : "opp"); }
  function statusText() {
    const v = view(), n = v.guesses.length, last = v.guesses[n - 1], won = !!last && last[4] === LEN;
    switch (S.mode) {
      case "ai":
        if (v.phase === "over") return won ? t("aiWon", n) : t("aiLost");
        return n ? t("guessN", n + 1) : t("aiFirst");
      case "solve":
        if (v.phase === "hiding") return t("solveHide");
        if (v.phase === "over") return won ? t("solveWon", n) : t("solveLost");
        return v.scoring ? t("solveScore") : t("thinking");
      case "pvp": {
        const P = L.maker === 1 ? t("p1") : t("p2"), Q = L.maker === 1 ? t("p2") : t("p1");
        if (v.phase === "hiding") return t("pvpHide", P, Q);
        if (v.scoring) return t("pvpScore", P, Q);
        if (v.phase === "guessing") return t("pvpGuess", Q, n + 1);
        const pts = t("pts", n + (won ? 0 : 1));
        return won ? t("pvpWon", Q, n, P, pts) : t("pvpLost", Q, P, pts);
      }
      case "online": {
        const g = NET.g;
        if (!NET.role) return t("onNone");
        if (NET.role === "host") {
          if (!NET.ready && !NET.connected) return t("connecting");
          if (!NET.everJoined) return t("sendInvite");
        } else if (!g) return NET.full ? t("full") : t("connectingGame");
        const maker = amMaker();
        if (g.phase === "over") {
          const pts = t("pts", n + (won ? 0 : 1));
          if (maker) return won ? t("onWonThem", oppLabel(true), n, pts) : t("onLostThem", oppLabel(true), pts);
          return won ? t("onWonMe", n, oppLabel(true), pts) : t("onLostMe", oppLabel(true), pts);
        }
        if (!NET.connected) return NET.role === "host" ? t("oppOffline", oppLabel(true)) : t("reconnecting");
        if (g.phase === "hiding") {
          if (!maker) return t("onHideThem", oppLabel(false));
          return mySecret() || NET.pending ? t("onSending") : t("onHideMe", oppLabel(false));
        }
        if (maker) {
          if (g.pending) return NET.pending ? t("onKeysSent") : t("onScoreMe", oppLabel(true));
          return t("onGuessThem", oppLabel(false));
        }
        if (g.pending) return t("onScoreThem", oppLabel(false));
        if (NET.pending) return t("onChecking");
        return t("onGuessMe", n + 1);
      }
    }
    return "";
  }

  // ---------- sounds ----------
  let sndG = -1, sndOver = false, sndMine = false, sndKey = "";
  function soundWatch() {
    const v = view(), key = S.mode + "|" + (NET.g ? NET.g.round : L.round);
    if (key !== sndKey) { sndKey = key; sndG = v.guesses.length; sndOver = v.phase === "over"; }
    if (v.guesses.length === sndG + 1) SFX.play("keyPeg", .05);
    sndG = v.guesses.length;
    const over = v.phase === "over";
    if (over && !sndOver) {
      const last = v.guesses[v.guesses.length - 1], cracked = !!last && last[4] === LEN;
      const breakerIsMe = S.mode === "ai" || (S.mode === "online" && !amMaker());
      const good = S.mode === "pvp" ? true : breakerIsMe ? cracked : !cracked;
      SFX.play(good ? "win" : "lose", .3);
    }
    sndOver = over;
    const mine = S.mode === "online" && (v.secretMode === "edit" || v.canGuess || v.scoring);
    if (mine && !sndMine) SFX.play("chime", .2);
    sndMine = mine;
  }
  function renderUI() {
    soundWatch();
    const mode = S.mode, local = mode !== "online";
    statusEl.textContent = statusText();
    const sb = $("#scoreBlock");
    sb.hidden = false;
    if (mode === "ai") {
      const st = S.stats.ai;
      $("#sA").textContent = st.solved; $("#lA").textContent = t("cracked");
      $("#sB").textContent = st.best || "–"; $("#lB").textContent = t("best");
      $("#scoreNote").textContent = t("played", st.played);
    } else if (mode === "solve") {
      const st = S.stats.solve;
      $("#sA").textContent = st.games; $("#lA").textContent = t("games");
      $("#sB").textContent = st.games ? (st.total / st.games).toFixed(1) : "–"; $("#lB").textContent = t("average");
      $("#scoreNote").textContent = "";
    } else if (mode === "pvp") {
      $("#sA").textContent = S.stats.pvp[1]; $("#lA").textContent = t("p1");
      $("#sB").textContent = S.stats.pvp[2]; $("#lB").textContent = t("p2");
      $("#scoreNote").textContent = t("pointsNote");
    } else if (NET.g && (NET.role === "guest" || NET.everJoined)) {
      const host = NET.role === "host", g = NET.g;
      $("#sA").textContent = host ? g.score.host : g.score.guest; $("#lA").textContent = t("you");
      $("#sB").textContent = host ? g.score.guest : g.score.host; $("#lB").textContent = NET.oppName || t("them");
      $("#scoreNote").textContent = t("pointsNote");
    } else sb.hidden = true;

    $("#onlinePanel").hidden = mode !== "online";
    const inGame = !!NET.role;
    $("#lobby").hidden = inGame;
    $("#ingame").hidden = !inGame;
    $("#inviteBox").hidden = NET.role !== "host";
    if (NET.role === "host") $("#inviteLink").value = inviteLink();
    $("#leaveBtn").textContent = NET.role === "host" ? t("endGame") : t("leaveGame");
    const line = $("#connLine");
    if (inGame && (NET.everJoined || NET.role === "guest")) {
      line.innerHTML = `<span class="dot${NET.connected ? " on" : ""}"></span>`;
      line.append(NET.connected ? t("connectedTo", NET.oppName || t("opp")) : t("notConnected"));
      line.hidden = false;
    } else line.hidden = true;

    $("#colorSet").disabled = $("#repSet").disabled = mode === "online" && inGame;
    $("#newBtn").hidden = $("#resetBtn").hidden = !local;
    $("#settingsNote").textContent = local ? t("noteLocal") : t("noteOnline");
    $("#legend").innerHTML = `<span>${keySVG("b")}${esc(t("legendBlack"))}</span><span>${keySVG("w")}${esc(t("legendWhite"))}</span>`;
    document.querySelector(`input[name=mode][value="${mode}"]`).checked = true;
    document.querySelector(`input[name=colors][value="${S.colors}"]`).checked = true;
    document.querySelector(`input[name=rep][value="${S.repeats ? 1 : 0}"]`).checked = true;
  }
  function render() { renderBoard(); renderUI(); }

  // ---------- events ----------
  boardEl.addEventListener("click", e => {
    const kh = e.target.closest("button.khole");
    if (kh) {
      const i = +kh.dataset.key;
      keys[i] = keys[i] === null ? "b" : keys[i] === "b" ? "w" : null; SFX.play("keyPeg");
      setNote(trayNote, ""); render();
      const again = boardEl.querySelector(`button.khole[data-key="${i}"]`);
      if (again) again.focus();
      return;
    }
    const b = e.target.closest("button.cell");
    if (!b || !codeEditable()) return;
    const i = +b.dataset.slot;
    if (draft[i] != null) draft[i] = null;
    sel = i; render();
    const again = boardEl.querySelector(`button.cell[data-slot="${i}"]`);
    if (again) again.focus();
  });
  $("#tray").addEventListener("click", e => {
    const b = e.target.closest(".comp");
    if (!b || b.disabled) return;
    if (b.dataset.keyc) addKey(b.dataset.keyc); else addColor(+b.dataset.color);
  });
  $("#submitBtn").addEventListener("click", submit);
  $("#clearBtn").addEventListener("click", () => { if (view().scoring) clearKeys(); else clearDraft(); setNote(trayNote, ""); render(); });
  $("#peekBtn").addEventListener("click", () => { L.peek = !L.peek; render(); });
  $("#againBtn").addEventListener("click", nextRound);
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input[type=text], input:not([type]), textarea")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const v = view();
    if (/^[1-8]$/.test(e.key)) {
      if (v.scoring) { if (e.key === "1") addKey("b"); else if (e.key === "2") addKey("w"); }
      else addColor(+e.key - 1);
      e.preventDefault();
    } else if (e.key === "Backspace" || e.key === "Delete") {
      if (v.scoring || codeEditable()) { removeLast(); e.preventDefault(); }
    } else if (e.key === "Enter" && !(e.target.closest && e.target.closest("button"))) {
      if (v.scoring || ((v.secretMode === "edit" || v.canGuess) && draft.every(x => x != null))) { submit(); e.preventDefault(); }
    }
  });

  document.querySelectorAll("input[name=mode]").forEach(i => i.addEventListener("change", () => setMode(i.value)));
  document.querySelectorAll("input[name=colors]").forEach(i => i.addEventListener("change", () => {
    S.colors = +i.value; save(); if (S.mode !== "online") newLocal(true); else render();
  }));
  document.querySelectorAll("input[name=rep]").forEach(i => i.addEventListener("change", () => {
    S.repeats = i.value === "1"; save(); if (S.mode !== "online") newLocal(true); else render();
  }));
  $("#newBtn").addEventListener("click", () => newLocal(true));
  $("#resetBtn").addEventListener("click", () => {
    if (S.mode === "ai") S.stats.ai = { solved: 0, played: 0, best: 0 };
    else if (S.mode === "solve") S.stats.solve = { games: 0, total: 0 };
    else if (S.mode === "pvp") S.stats.pvp = { 1: 0, 2: 0 };
    save(); renderUI();
  });
  $("#inviteBtn").addEventListener("click", () => hostStart(null));
  $("#shareBtn").addEventListener("click", () => shareOrCopy(t("shareInvite"), inviteLink(), $("#inviteLink")));
  $("#leaveBtn").addEventListener("click", () => { leaveOnline(true); setNote(onNote, ""); renderUI(); });
  let nameTimer = null;
  $("#myName").addEventListener("input", () => {
    clearTimeout(nameTimer);
    nameTimer = setTimeout(() => {
      lsSet(K.name, myName());
      if (NET.role === "host") sendState();
      else if (NET.conn && NET.connected) { try { NET.conn.send({ t: "name", name: myName() }); } catch (e) {} }
    }, 600);
  });

  // ---------- language ----------
  function detectLang() {
    const saved = lsGet(K.lang);
    if (saved === "en" || saved === "hu") return saved;
    const first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    return /^hu\b/i.test(first) ? "hu" : "en";
  }
  function applyLang() {
    document.documentElement.lang = LANG;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    document.querySelectorAll(".lang-btn[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
    [onNote, trayNote].forEach(el => { if (el._note) el.textContent = el._note.key ? t(el._note.key, ...el._note.args) : ""; });
    render();
  }
  document.querySelectorAll(".lang-btn[data-lang]").forEach(b => b.addEventListener("click", () => { LANG = b.dataset.lang; lsSet(K.lang, LANG); applyLang(); }));

  // ---------- start ----------
  function handleHash() {
    const m = /^#join-([a-z2-9]{6})$/i.exec(location.hash || "");
    if (!m) return false;
    const code = m[1].toLowerCase();
    if (NET.role === "guest" && NET.code === code) return true;
    if (S.mode !== "online") { clearTimeout(aiTimer); aiTimer = null; S.mode = "online"; save(); }
    let saved = null;
    try { saved = JSON.parse(lsGet(K.host) || "null"); } catch (e) {}
    if (saved && saved.code === code) { setHash(""); if (!(NET.role === "host" && NET.code === code)) hostStart(saved); else render(); }
    else guestStart(code);
    return true;
  }
  window.addEventListener("hashchange", handleHash);

  buildDefs();
  window.addEventListener("contrastchange", () => render());
  load();
  LANG = detectLang();
  if (!handleHash()) { if (S.mode === "online") enterOnline(); else newLocal(true); }
  applyLang();
})();
</script>
<script>
  // Appearance and high-visibility mode: shared by all the games on this site.
  (function () {
    const root = document.documentElement;
    function current() { const v = root.getAttribute("data-theme"); return v === "light" || v === "dark" ? v : "auto"; }
    function mark() {
      document.querySelectorAll(".theme-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === current())));
      document.querySelectorAll(".contrast-btn").forEach(b => b.setAttribute("aria-pressed", String(root.getAttribute("data-contrast") === "high")));
      document.querySelectorAll(".sound-btn").forEach(b => b.setAttribute("aria-pressed", String(window.SFX ? SFX.enabled() : true)));
    }
    document.querySelectorAll(".theme-btn").forEach(b => b.addEventListener("click", () => {
      const v = b.dataset.themeChoice;
      if (v === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", v);
      try { if (v === "auto") localStorage.removeItem("amoba-theme"); else localStorage.setItem("amoba-theme", v); } catch (e) {}
      mark();
    }));
    document.querySelectorAll(".contrast-btn").forEach(b => b.addEventListener("click", () => {
      const on = root.getAttribute("data-contrast") !== "high";
      if (on) root.setAttribute("data-contrast", "high"); else root.removeAttribute("data-contrast");
      try { if (on) localStorage.setItem("amoba-contrast", "high"); else localStorage.removeItem("amoba-contrast"); } catch (e) {}
      mark();
      window.dispatchEvent(new Event("contrastchange"));
    }));
    document.querySelectorAll(".sound-btn").forEach(b => b.addEventListener("click", () => {
      const on = !(window.SFX && SFX.enabled());
      try { if (on) localStorage.removeItem("amoba-sound"); else localStorage.setItem("amoba-sound", "off"); } catch (e) {}
      mark();
      if (on && window.SFX) SFX.play("hold");
    }));
    mark();
  })();
</script>
